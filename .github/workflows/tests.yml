name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
        exclude:
          # GitHub provides Python 3.10 macOS builds for x64 only; latest macOS
          # may be ARM64. Exercise the minimum version on Windows and Linux.
          - os: macos-latest
            python: '3.10'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Verify portable launcher
        run: python start.py --help
      - name: Check all exercises and HTTP endpoints
        run: python -m unittest discover -v
