name: Portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build portable ZIP
        run: python scripts/build_portable.py
      - name: Extract and test bundled runtime and compiler
        shell: pwsh
        run: |
          Expand-Archive dist/SQL-DSA-Lab-Portable.zip build/verify
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & build/verify/SQL-DSA-Lab/start.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/verify/SQL-DSA-Lab/runtime/python.exe -m unittest discover -s build/verify/SQL-DSA-Lab/app -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SQL-DSA-Lab-Portable
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SQL-DSA-Lab-Portable
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "SQL + DSA Lab $RELEASE_TAG" --generate-notes
          fi
